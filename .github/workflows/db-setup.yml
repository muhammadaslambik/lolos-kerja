name: Setup Database
# Dijalankan manual dari tab Actions di GitHub, jadi laptop tidak diperlukan.
on:
  workflow_dispatch:
    inputs:
      seed:
        description: "Isi data contoh (centang hanya untuk demo)"
        type: boolean
        default: true
jobs:
  setup:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm install
      - run: npx prisma db push
      - if: ${{ inputs.seed }}
        run: npx prisma db seed
