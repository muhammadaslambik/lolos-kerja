name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://lolos:lolos@localhost:5432/loloskerja
      DIRECT_URL: postgresql://lolos:lolos@localhost:5432/loloskerja
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm install
      - run: npx prisma generate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
